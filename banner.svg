<svg width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020818"/>
      <stop offset="50%" style="stop-color:#0d1f3c"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8f4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a0c4ff;stop-opacity:0.6"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#sky)"/>

  <!-- Stars scattered -->
  <circle cx="45" cy="20" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="120" cy="55" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="200" cy="18" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="280" cy="40" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="350" cy="12" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="400" cy="35" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="460" cy="22" r="1.4" fill="white" opacity="0.9"/>
  <circle cx="530" cy="50" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="600" cy="15" r="1.1" fill="white" opacity="0.8"/>
  <circle cx="670" cy="42" r="1.3" fill="white" opacity="0.7"/>
  <circle cx="740" cy="10" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="810" cy="33" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="860" cy="18" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="88" cy="80" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="160" cy="95" r="1.0" fill="white" opacity="0.6"/>
  <circle cx="700" cy="80" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="780" cy="70" r="1.1" fill="white" opacity="0.7"/>
  <circle cx="840" cy="88" r="0.7" fill="white" opacity="0.5"/>
  <circle cx="20" cy="120" r="0.9" fill="white" opacity="0.6"/>
  <circle cx="880" cy="110" r="1.0" fill="white" opacity="0.7"/>

  <!-- Moon glow -->
  <circle cx="820" cy="55" r="38" fill="#58a6ff" opacity="0.08" filter="url(#softglow)"/>
  <!-- Moon -->
  <circle cx="820" cy="55" r="22" fill="url(#moon)" opacity="0.85" filter="url(#glow)"/>
  <!-- Moon craters subtle -->
  <circle cx="812" cy="50" r="4" fill="#c8dcf5" opacity="0.3"/>
  <circle cx="826" cy="62" r="3" fill="#c8dcf5" opacity="0.25"/>

  <!-- Mountain silhouettes back layer -->
  <polygon points="0,200 60,130 130,170 200,110 280,155 360,100 440,145 520,95 600,140 680,90 760,135 840,105 900,130 900,200" fill="#0a1628" opacity="0.9"/>
  <!-- Mountain front layer -->
  <polygon points="0,200 80,155 160,180 240,145 320,168 400,138 480,160 560,132 640,158 720,128 800,152 870,140 900,155 900,200" fill="#06101f"/>

  <!-- Pine trees silhouette left -->
  <polygon points="30,200 40,165 50,200" fill="#040d1a"/>
  <polygon points="50,200 62,158 74,200" fill="#040d1a"/>
  <polygon points="72,200 82,168 92,200" fill="#040d1a"/>

  <!-- Pine trees silhouette right -->
  <polygon points="830,200 840,168 850,200" fill="#040d1a"/>
  <polygon points="850,200 862,158 874,200" fill="#040d1a"/>
  <polygon cx="870" points="870,200 880,165 890,200" fill="#040d1a"/>

  <!-- Shooting star -->
  <line x1="300" y1="30" x2="340" y2="50" stroke="white" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
  <circle cx="300" cy="30" r="1.5" fill="white" opacity="0.9" filter="url(#glow)"/>

  <!-- Main title -->
  <text x="450" y="105" font-family="'Georgia', serif" font-size="36" font-weight="bold"
        fill="white" text-anchor="middle" filter="url(#glow)" opacity="0.95">
    Hi, I'm Soniya Phaltane 🌌
  </text>

  <!-- Subtitle -->
  <text x="450" y="145" font-family="'Courier New', monospace" font-size="15"
        fill="#58a6ff" text-anchor="middle" filter="url(#glow)" opacity="0.9">
    ML Engineer  ·  AI Security  ·  CosmicMicra
  </text>

  <!-- Subtle bottom gradient overlay -->
  <rect width="900" height="40" y="160" fill="#040d1a" opacity="0.4"/>
</svg>
